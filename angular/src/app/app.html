<div class="app">
  <h1>OSS リポジトリ検索</h1>
  <input
    class="search"
    type="search"
    placeholder="リポジトリ名・説明で検索"
    [value]="query()"
    (input)="onQuery($event)"
  />
  <div class="filters">
    @for (l of languages; track l) {
      <button type="button" [class.active]="l === activeLang()" (click)="activeLang.set(l)">
        {{ l }}
      </button>
    }
  </div>
  <p class="summary">{{ repos.length }} 件中 {{ visible().length }} 件を表示 ／ ★ {{ favorites().size }}</p>
  <div class="list">
    @for (r of visible(); track r.fullName) {
      <div class="card">
        <div class="card-head">
          <span class="card-name">{{ r.fullName }}</span>
          <span class="card-stars">★ {{ r.stars.toLocaleString('en-US') }}</span>
        </div>
        <div class="card-desc">{{ r.description }}</div>
        <div class="card-foot">
          <span class="tag">{{ r.language }}</span>
          <button type="button" class="fav" [class.on]="favorites().has(r.fullName)" (click)="toggleFavorite(r.fullName)">
            ★ お気に入り
          </button>
        </div>
      </div>
    } @empty {
      <p class="empty">該当するリポジトリがありません</p>
    }
  </div>
</div>
